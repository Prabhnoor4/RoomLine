<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Wilder Hotel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="chat-app">

    <header class="chat-header">
      <div class="brand">
        <div class="brand-mark" id="brand-mark">W</div>
        <div class="brand-text">
          <h1 id="hotel-name">The Wilder Hotel</h1>
          <span id="hotel-tagline">Guest Services</span>
        </div>
      </div>

      <div class="room-field">
        <label for="room-number">Room</label>
        <input type="text" id="room-number" placeholder="214" />
      </div>
    </header>

    <main class="chat-messages" id="chat-messages">

      <div class="message assistant">
        <div class="avatar" id="assistant-avatar">W</div>
        <div class="bubble" id="welcome-bubble">
          Welcome to The Wilder Hotel. I'm your virtual concierge — ask me about
          room service, housekeeping, hotel amenities, or anything else you need
          during your stay.
        </div>
      </div>

      <div class="quick-actions" id="quick-actions"></div>

    </main>

    <form class="chat-input-bar" id="chat-form">
      <input type="text" id="chat-input" placeholder="Message the front desk..." autocomplete="off" />
      <button type="submit" class="send-btn" id="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
